services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest@sha256:a45b5ab0f850f39edb4cc9c95bbd967b52ddc3d4574a4dfb45561177db6c88f4
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Athens
    volumes:
      - /portainer/Files/AppData/Config/radarr/config:/config
      - /mnt/media/Movies:/movies #optional
      - /mnt/media/storage/downloads/tvshows:/downloads
      - /mnt/media/temp/blackhole/tvshows:/blackhole
      - /etc/localtime:/etc/localtime
    ports:
        - 7878
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`radarr.sp4rck.ovh`)"
      - "traefik.http.routers.radarr.entrypoints=websecure"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"
      - "traefik.http.routers.radarr.service=radarr"
      - "traefik.http.routers.radarr.tls.certresolver=leresolver"
    restart: unless-stopped
    networks: 
      - portainer_default
networks:
  portainer_default:
    name: "portainer_default"
    external: true
