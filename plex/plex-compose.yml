services:
  plex-server:
    container_name: plex-server
    image: plexinc/pms-docker:latest@sha256:6d778d41daae68f89115aa87a44ae14a96b23e71a2093da173b5a9aac4091336
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=Europe/Paris # timezone, defined in .env
      - HOSTNAME=plex@home
    volumes:
      - plex_config:/config # plex database
      - /mnt/media:/data:ro # media library

volumes:
  plex_config:
    name: plex_config
