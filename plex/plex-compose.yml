services:
  plex-server:
    container_name: plex-server
    image: plexinc/pms-docker:latest@sha256:01bdf0ad6d53198da4331540c1e73ab65db7a72e961fff97ecb0847d46055c5f
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=Europe/Paris # timezone, defined in .env
      - HOSTNAME=plex@home
    volumes:
      - plex_config:/config # plex database
      - /mnt/media:/data:ro # media library

volumes:
  plex_config:
    name: plex_config
