services:
  plex-server:
    container_name: plex-server
    image: plexinc/pms-docker:latest
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=Europe/Paris # timezone, defined in .env
      - HOSTNAME=plex@home
    volumes:
      - plex_config:/config # plex database
      - /mnt/media:/data:ro # media library
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.plex.rule=Host(`plex.sp4rck.ovh`)"
      - "traefik.http.routers.plex.entrypoints=websecure"
      - "traefik.http.services.plex.loadbalancer.server.port=32400"
      - "traefik.http.routers.plex.service=plex"
      - "traefik.http.routers.plex.tls.certresolver=leresolver"

volumes:
  plex_config:
    name: plex_config
